      api_base: os.environ/LLAMA4_SCOUT_API_BASE
      api_key: os.environ/LLAMA4_SCOUT_API_KEY
  - model_name: deepseek-v3
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V3
      api_base: os.environ/DEEPSEEK_V3_API_BASE
