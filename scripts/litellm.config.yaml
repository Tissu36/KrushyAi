model_list:
  - model_name: gpt-oss-20b
    litellm_params:
      model: openai/openai/gpt-oss-20b
      api_base: os.environ/GPT_OSS_20B_API_BASE
      api_key: os.environ/GPT_OSS_20B_API_KEY
  - model_name: qwen-general
    litellm_params:
      model: openai/Qwen/Qwen3.8-27B
      api_base: os.environ/QWEN_GENERAL_API_BASE
      api_key: os.environ/QWEN_GENERAL_API_KEY
  - model_name: gemma-general
    litellm_params:
      model: openai/google/gemma-4-31B-it
      api_base: os.environ/GEMMA_GENERAL_API_BASE
      api_key: os.environ/GEMMA_GENERAL_API_KEY
